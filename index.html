<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="music" autoplay loop>
  <source src="music.mp3" type="audio/mp3">
</audio>

<canvas id="bg"></canvas>

<div id="overlay"></div>

<div id="app">

  <!-- SCENE 1 -->
  <div class="scene active" id="s1">
    <div class="title">Anh có điều muốn nói với em...</div>
  </div>

  <!-- SCENE 2 -->
  <div class="scene" id="s2">
    <div id="t2"></div>
  </div>

  <!-- SCENE 3 -->
  <div class="scene" id="s3">
    <div id="t3"></div>
  </div>

  <!-- SCENE 4 LETTER -->
  <div class="scene" id="s4">
    <div class="paper">
      <div id="letter"></div>
    </div>
  </div>

  <!-- SCENE 5 QUESTION -->
  <div class="scene" id="s5">
    <div class="question">Em có cười chưa? 😊</div>

    <div class="btns">
      <button id="yesBtn">Cười rồi 😆</button>
      <button id="noBtn">Chưa đâu 😤</button>
    </div>
  </div>

  <!-- SCENE 6 RESULT -->
  <div class="scene" id="s6">
    <div id="result"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
