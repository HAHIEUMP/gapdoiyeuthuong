<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="music" autoplay loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<canvas id="bg"></canvas>

<div id="app">

<!-- SCENE 1 -->
<div class="scene active" id="s1">
<div class="glow">Có một điều anh chưa từng nói hết...</div>
</div>

<!-- SCENE 2 -->
<div class="scene" id="s2">
<div id="photos"></div>
</div>

<!-- SCENE 3 -->
<div class="scene" id="s3">
<div id="text3"></div>
</div>

<!-- SCENE 4 LETTER -->
<div class="scene" id="s4">
<div id="paper">
<div id="letter"></div>
</div>
</div>

<!-- SCENE 5 SURPRISE -->
<div class="scene" id="s5">
<div class="pop">Anh làm cái này cho em nè ❤️</div>
<div id="confetti"></div>
</div>

<!-- SCENE 6 CHOICE -->
<div class="scene" id="s6">
<div class="question">Em có cười chưa? 😳</div>
<button id="ok">Cười rồi 😆</button>
<button id="no">Chưa đâu 😤</button>
</div>

<!-- SCENE 7 END -->
<div class="scene" id="s7">
<div id="end"></div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
